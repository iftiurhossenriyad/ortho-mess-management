<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recover Account | Ortho</title>
    <style>
        :root { --forest: #1b4332; --ink: #18241e; --muted: #65736b; --line: #e4eae5; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; color: var(--ink); font-family: Arial, sans-serif; background: #f5f7f4; }
        .card { width: min(100%, 460px); padding: clamp(26px, 6vw, 42px); border: 1px solid #e8eee9; border-radius: 22px; background: #fff; box-shadow: 0 22px 60px rgba(20,54,38,.09); }
        .brand-wordmark { display: flex; flex-direction: column; gap: 5px; margin: 0 auto 21px; color: var(--forest); font-size: 14px; font-weight: 800; letter-spacing: .18em; text-align: center; }
        .brand-wordmark span { color: var(--muted); font-size: 8px; letter-spacing: .16em; }
        h1 { margin: 0; color: var(--ink); font: 500 31px Georgia, serif; letter-spacing: -.025em; text-align: center; }
        .sub { margin: 10px 0 24px; color: var(--muted); font-size: 13px; line-height: 1.6; text-align: center; }
        form { display: grid; gap: 15px; }
        label { display: grid; gap: 7px; color: #334155; font-size: 12px; font-weight: 700; }
        input { width: 100%; min-height: 48px; padding: 12px 13px; border: 1px solid var(--line); border-radius: 10px; outline: none; color: var(--ink); font-size: 14px; transition: border-color .18s ease, box-shadow .18s ease; }
        input:focus { border-color: #78a88a; box-shadow: 0 0 0 3px rgba(27,67,50,.09); }
        button { min-height: 49px; border: 0; border-radius: 10px; color: white; background: var(--forest); cursor: pointer; font-weight: 700; transition: background .18s ease, transform .18s ease; }
        button:hover { background: #123524; transform: translateY(-1px); }
        .message { margin: 0 0 16px; padding: 12px; border: 1px solid #f5d5ca; border-radius: 10px; color: #9b3d30; background: #fff5f1; font-size: 13px; line-height: 1.5; }
        .message:empty { display: none; }
        .result { margin: 17px 0 0; padding: 13px; border: 1px solid #cdebd8; border-radius: 10px; color: #165b3b; background: #f0f8f2; font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
        .result:empty { display: none; }
        .verify-form { display: none; margin-top: 16px; }
        .verify-form.active { display: grid; }
        .back { display: block; margin-top: 22px; color: var(--forest); font-size: 12px; font-weight: 700; text-align: center; text-decoration: none; }
        .back:hover { text-decoration: underline; }
        .hint { margin: 18px 0 0; color: #94a3b8; font-size: 11px; line-height: 1.5; text-align: center; }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand-wordmark">ORTHO<span>MESS MANAGEMENT</span></div>
        <h1>Recover your account</h1>
        <p class="sub">Enter your mess and account details. We will send a one-time code to the registered mobile number.</p>
        <p id="message" class="message"></p>
        <form id="forgot-form">
            <label>Mess ID or Mess Code <input id="mess-id" type="text" placeholder="ORTHO-MESS-0001" required></label>
            <label>User ID or Phone <input id="identifier" type="text" placeholder="ORTHO-1-0002 or phone" required></label>
            <button type="submit">Send OTP to Mobile</button>
        </form>
        <form id="verify-form" class="verify-form">
            <label>Mobile OTP <input id="otp" type="text" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit OTP" required></label>
            <button type="submit">Verify OTP and Recover Password</button>
        </form>
        <p id="result" class="result"></p>
        <a class="back" href="local_login.html">Back to local sign in</a>
        <p class="hint">The OTP expires in 10 minutes. After recovery, sign in with the temporary password.</p>
    </main>
    <script>
        document.getElementById('forgot-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const message = document.getElementById('message');
            const resultBox = document.getElementById('result');
            message.textContent = '';
            resultBox.textContent = '';
            try {
                const response = await fetch('local_auth.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'request_reset_otp', mess_id: document.getElementById('mess-id').value.trim(), identifier: document.getElementById('identifier').value.trim() }) });
                const result = await response.json();
                if (result.status !== 'success') throw new Error(result.message || 'Recovery failed.');
                resultBox.textContent = result.message;
                document.getElementById('verify-form').classList.add('active');
            } catch (error) { message.textContent = error.message; }
        });
        document.getElementById('verify-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const message = document.getElementById('message');
            const resultBox = document.getElementById('result');
            message.textContent = '';
            try {
                const response = await fetch('local_auth.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'verify_reset_otp', otp: document.getElementById('otp').value.trim() }) });
                const result = await response.json();
                if (result.status !== 'success') throw new Error(result.message || 'OTP verification failed.');
                resultBox.textContent = result.data.temporary_password + ' is your temporary password. Sign in and change it immediately.';
                document.getElementById('verify-form').classList.remove('active');
            } catch (error) { message.textContent = error.message; }
        });
    </script>
</body>
</html>
