<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Ortho</title>
    <style>
        :root { --forest: #1b4332; --ink: #17212b; --muted: #64748b; --line: #e2e8f0; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: var(--ink); font-family: Arial, sans-serif; background: #f3f7f4; }
        .card { width: min(100%, 480px); padding: 34px; border: 1px solid #e2ebe5; border-radius: 16px; background: #fff; box-shadow: 0 20px 45px rgba(27,67,50,.1); }
        .logo { display: block; width: 86px; height: 86px; margin: 0 auto 18px; object-fit: contain; border-radius: 12px; }
        h1 { margin: 0; color: var(--ink); font: 500 30px Georgia, serif; text-align: center; }
        .sub { margin: 9px 0 25px; color: var(--muted); font-size: 13px; line-height: 1.5; text-align: center; }
        .mode { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
        .mode button { min-height: 43px; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); background: #fff; cursor: pointer; font-weight: 700; }
        .mode button.active { color: #fff; border-color: var(--forest); background: var(--forest); }
        form { display: grid; gap: 14px; }
        label { display: grid; gap: 7px; color: #334155; font-size: 12px; font-weight: 700; }
        input { width: 100%; min-height: 47px; padding: 12px 13px; border: 1px solid var(--line); border-radius: 10px; outline: none; font-size: 14px; }
        input:focus { border-color: var(--forest); box-shadow: 0 0 0 3px rgba(27,67,50,.1); }
        .conditional { display: none; }
        .conditional.active { display: grid; gap: 14px; }
        .submit { min-height: 49px; margin-top: 3px; border: 0; border-radius: 10px; color: #fff; background: var(--forest); cursor: pointer; font-weight: 700; }
        .submit:hover { background: #123524; }
        .message { margin: 0 0 16px; padding: 11px; border-radius: 8px; color: #9b3d30; background: #fff0eb; font-size: 13px; line-height: 1.4; }
        .message:empty { display: none; }
        .success { color: #165b3b; background: #eaf7ef; }
        .back { display: block; margin-top: 20px; color: var(--forest); font-size: 12px; font-weight: 700; text-align: center; text-decoration: none; }
        .back:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <main class="card">
        <img class="logo" src="Logo.jpeg" alt="Ortho logo">
        <h1>Create your account</h1>
        <p class="sub">Start a new mess or join an existing one with its invite code.</p>
        <div class="mode">
            <button id="create-mode" class="active" type="button">Create New Mess</button>
            <button id="join-mode" type="button">Join Existing Mess</button>
        </div>
        <p id="message" class="message"></p>
        <form id="register-form">
            <label>Full Name <input id="name" type="text" maxlength="100" autocomplete="name" placeholder="Your full name" required></label>
            <label>Phone Number <input id="phone" type="tel" maxlength="30" autocomplete="tel" placeholder="Your phone number" required></label>
            <label>Password <input id="password" type="password" minlength="8" maxlength="255" autocomplete="new-password" placeholder="At least 8 characters" required></label>
            <label>Confirm Password <input id="confirm-password" type="password" minlength="8" maxlength="255" autocomplete="new-password" placeholder="Repeat your password" required></label>
            <div id="create-fields" class="conditional active">
                <label>Mess Name <input id="mess-name" type="text" placeholder="e.g. Ortho Flat 4B"></label>
            </div>
            <div id="join-fields" class="conditional">
                <label>Mess Invite Code <input id="invite-code" type="text" placeholder="Enter invite code"></label>
            </div>
            <button class="submit" type="submit">Create Manager Account</button>
        </form>
        <a class="back" href="local_login.html?flow=provider-link">Already have an account? Connect social sign-in</a>
    </main>
    <script>
        let mode = 'create_mess';
        const createMode = document.getElementById('create-mode');
        const joinMode = document.getElementById('join-mode');
        const createFields = document.getElementById('create-fields');
        const joinFields = document.getElementById('join-fields');
        const submit = document.querySelector('.submit');
        function setMode(nextMode) {
            mode = nextMode;
            const creating = mode === 'create_mess';
            createMode.classList.toggle('active', creating);
            joinMode.classList.toggle('active', !creating);
            createFields.classList.toggle('active', creating);
            joinFields.classList.toggle('active', !creating);
            document.getElementById('mess-name').required = creating;
            document.getElementById('invite-code').required = !creating;
            submit.textContent = creating ? 'Create Manager Account' : 'Join Mess as Member';
        }
        createMode.addEventListener('click', () => setMode('create_mess'));
        joinMode.addEventListener('click', () => setMode('join_mess'));
        document.getElementById('register-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const message = document.getElementById('message');
            message.className = 'message';
            message.textContent = '';
            if (document.getElementById('password').value !== document.getElementById('confirm-password').value) {
                message.textContent = 'Passwords do not match.';
                return;
            }
            const body = { action: mode, name: document.getElementById('name').value.trim(), phone: document.getElementById('phone').value.trim(), password: document.getElementById('password').value };
            if (mode === 'create_mess') body.mess_name = document.getElementById('mess-name').value.trim();
            else body.invite_code = document.getElementById('invite-code').value.trim().toUpperCase();
            try {
                const response = await fetch('register.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                const result = await response.json();
                if (result.status !== 'success') throw new Error(result.message || 'Account creation failed.');
                message.className = 'message success';
                const accountDetails = [
                    `Mess Code: ${result.data.mess_code || result.data.mess_id}`,
                    `User ID: ${result.data.user_code}`,
                    result.data.invite_code ? `Invite Code: ${result.data.invite_code}` : ''
                ].filter(Boolean).join(' | ');
                message.textContent = `Account ready. Save these details: ${accountDetails}. Sign in once with your mess credentials to connect a social provider; use social sign-in for future visits.`;
            } catch (error) { message.textContent = error.message; }
        });
    </script>
</body>
</html>
